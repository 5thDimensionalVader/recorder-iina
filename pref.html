<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Recorder Preferences</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        font-size: 13px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        padding: 16px;
        margin: 0;
      }

      h2,
      p {
        margin: 0;
      }

      h2 {
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
      }

      .pref-section {
        margin-bottom: 18px;
      }

      .pref-help {
        margin-bottom: 9px;
        font-size: 11px;
        line-height: 1.4;
        opacity: 0.58;
      }

      input {
        width: 100%;
        min-height: 26px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <section class="pref-section">
      <h2>FFmpeg binary</h2>
      <p class="pref-help">
        Optional. Leave blank to detect Homebrew installations automatically. Enter a full path only
        when FFmpeg is installed somewhere else.
      </p>
      <input
        type="text"
        data-pref-key="ffmpeg_path"
        aria-label="FFmpeg binary path"
        placeholder="/opt/homebrew/bin/ffmpeg"
      />
    </section>
  </body>
</html>
